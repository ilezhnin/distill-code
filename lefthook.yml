# Git hooks, run through lefthook.
# See: https://github.com/evilmartians/lefthook
#
# Hooks prevent publishing secrets and private material. They never run builds,
# formatting or functional suites. CI checks vulnerabilities and compile errors.

pre-commit:
  commands:
    benchmark-privacy:
      run: node scripts/hooks/benchmark-privacy.mjs --staged
    secrets:
      run: node scripts/hooks/secret-scan.mjs staged

pre-merge-commit:
  commands:
    benchmark-privacy:
      run: node scripts/hooks/benchmark-privacy.mjs --staged
    secrets:
      run: node scripts/hooks/secret-scan.mjs staged

# Hooks check without rewriting or staging files. A missing tool or failed
# check blocks the operation; fix the environment instead of deferring to CI.
pre-push:
  commands:
    secrets:
      run: node scripts/hooks/secret-scan.mjs push
      use_stdin: true
    private-history:
      # Plain sh: a GUI client's trimmed PATH, or a
      # local override, must not skip this one. It reads the refs being
      # pushed from Git on stdin.
      run: sh scripts/hooks/private-history-guard.sh "{2}"
      use_stdin: true
