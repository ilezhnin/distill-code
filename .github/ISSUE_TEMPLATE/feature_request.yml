name: Feature request
description: Propose a change to how the flock works.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or workflow, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How the app should behave. If it touches a law in `LAWS/`, say which one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
