name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  FORCE_COLOR: "1"

jobs:
  safety:
    name: Secrets and publication safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Activate Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Scan reachable history for secrets
        run: node scripts/hooks/secret-scan.mjs history
      - name: Reject private material in the published tree
        run: node scripts/hooks/benchmark-privacy.mjs --tree
      - name: Test publication guards and CI scope
        run: node --test scripts/ci-scope.test.mjs scripts/hooks/tests/secret-scan.test.mjs scripts/hooks/tests/benchmark-privacy.test.mjs scripts/hooks/tests/private-history-guard.test.mjs
      - name: Select affected compile gates
        id: scope
        run: node scripts/ci-scope.mjs

  # Advisories are checked on every push, even when lockfiles did not change.
  audits:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Activate Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit shipped npm dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Install cargo-audit
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

  frontend:
    name: Frontend compilation and command contract
    needs: safety
    if: needs.safety.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Activate Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check command contract and build frontend
        run: just ci-frontend

  rust-windows:
    name: Native compilation and command security
    needs: safety
    if: needs.safety.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FLOCK_TAURI_CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install just
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: just@1.48.0
          fallback: none
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Check native compilation and command boundaries
        shell: powershell
        run: just ci-native
