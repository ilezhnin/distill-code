# distill-bench: the benchmark sandbox. No Windows drive is mounted and no
# Windows program can be started from inside.
[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[network]
# WSL would link /etc/resolv.conf into /mnt/wsl, which every run hides;
# provision.sh writes a plain file with public resolvers instead.
generateResolvConf=false

[boot]
systemd=false
command=/usr/local/sbin/bench-net
