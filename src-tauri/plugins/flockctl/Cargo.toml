[package]
name = "tauri-plugin-flockctl"
version = "0.6.2"
edition = "2021"
links = "tauri-plugin-flockctl"
build = "build.rs"

[lib]
name = "tauri_plugin_flockctl"
path = "src/lib.rs"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
tokio = { version = "1", features = ["sync", "time", "rt", "net"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
# The ping's proof that this broker holds its discovery file's token.
sha2 = { version = "0.10", optional = true }

[features]
# Without `server` the crate compiles to an inert stub: permissions are still
# generated by build.rs, but no runtime code (including `init`) exists.
server = ["dep:axum", "dep:sha2"]

[dev-dependencies]
# The CLI's nonce, in the test that compiles the CLI's proof check
# (crates/flockctl/src/broker_proof.rs) against this broker.
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
