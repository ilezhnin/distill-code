[package]
name = "Berd"
version = "0.6.2"
description = "Distill desktop app"
authors = ["Distill"]
edition = "2021"
default-run = "Berd"

[lib]
name = "berd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Explicit workspace so the berdctl plugin is a member: `cargo test -p
# <plugin> --features ...` only works for workspace members. app-test-driver
# stays excluded (a plain path dependency, as before this workspace existed).
[workspace]
members = [
  "crates/berd-monitor",
  "crates/berdctl",
  "plugins/berdctl",
]
exclude = ["plugins/app-test-driver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
dunce = "1"
doctor = { git = "https://github.com/block/builderbot", rev = "73ff9a0521dcc784c9514911a655187e5dd3b6ca" }
flate2 = "1"
tempfile = "3"
hex = "0.4"
ignore = "0.4.25"
fern = "0.7"
infer = "0.19.0"
libc = "0.2"
log = "0.4.29"
mime_guess = "2"
futures-util = "0.3"
nucleo-matcher = "0.3"
percent-encoding = "2"
minisign-verify = "0.2.5"
plist = "1"
portable-pty = "0.9.0"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
tar = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.4"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["protocol-asset"] }
toml = "1.1.4"
tauri-plugin-berdctl = { path = "plugins/berdctl" }
tauri-plugin-app-test-driver = { path = "plugins/app-test-driver" }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-tungstenite = "0.28"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSAlert", "NSButton", "NSControl", "NSCell", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSError", "NSFileManager", "NSObject", "NSProcessInfo", "NSString", "NSURL"] }
objc2-user-notifications = "0.3.2"


[features]
default = []
berdctl = ["tauri-plugin-berdctl/server"]
app-test-driver = []
devtools = ["tauri/devtools"]
# Additive "disable" features. Cargo features are purely additive, so a
# restricted build is expressed by ADDING these (never with
# --no-default-features + re-listing everything you want to keep).
#
# no-managed-acp-tools: ships no Berd-managed ACP bridges. The startup
# reconciler and the managed installer treat the managed set as empty, so
# nothing installs at runtime and the related doctor checks stay silent — the
# analogue of the old empty-`acp-tools.lock.json` restricted-build lever.
no-managed-acp-tools = []

[dev-dependencies]
# Mirrors goose's bare-name command resolver (crates/goose Cargo.toml): the
# native Windows gate resolves the bridge launcher through the exact
# `which_in_global` path goosed uses, so PATHEXT resolution is under test.
which = { version = "8", default-features = false, features = ["real-sys"] }

# Debug builds of this workspace are dominated by debug info: with cargo's
# defaults (`debug = 2` everywhere) `src-tauri/target` reached ~56 GB here,
# ~9 GB of it PDBs and most of the 20 GB of object files debug sections from
# third-party crates nobody steps through. Dependencies and build scripts get
# no debug info; our own crates keep line tables, which is what backtraces,
# panic locations and profilers actually read.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

# `cargo test` inherits these through the dev profile.
[profile.test.package."*"]
debug = false
